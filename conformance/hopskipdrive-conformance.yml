summary: >-
  HopSkipDrive publishes a security/compliance posture (SOC 2 Type II, NIST CSF) but
  publishes no machine-readable API contract, no developer portal and no public API
  documentation. Its platform surface is account-gated commercial software (RideIQ,
  the HopSkipDrive family app, the CareDriver app). Everything below marked
  conforms: false is recorded as "not published publicly", not as a technical failure.
