aid: hopskipdrive
name: HopSkipDrive
description: 'HopSkipDrive is a Los Angeles-based youth and supplemental student transportation
  company that arranges rides for students who cannot be served by a traditional yellow
  bus — students with IEPs, students experiencing homelessness under McKinney-Vento,
  students in foster care, and students on out-of-boundary or hard-to-route trips.
  Districts, charter networks, county offices, government agencies and nonprofits book
  and monitor rides through RideIQ, HopSkipDrive''s web platform, while families track
  trips in the HopSkipDrive mobile app and vetted CareDrivers work from a driver app.
  The company also sells RouteWise AI, a routing-analysis product that models a district''s
  student base, fleet and constraints to produce route scenarios. HopSkipDrive reports
  more than 5 million completed rides across 14,000+ schools and 2,000+ districts. Its
  platform surface is commercial and account-gated: as of this profile HopSkipDrive
  publishes no public developer portal, no API documentation and no machine-readable
  API contract, though its RideIQ front end is backed by a private versioned REST API
  host and a WebSocket event stream.'
